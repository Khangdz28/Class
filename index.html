
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Adventures Script</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                linear-gradient(rgba(10, 10, 30, 0.75),
                rgba(10, 10, 30, 0.9)),
                url("https://tr.rbxcdn.com/180DAY-8e8c9b7f0f3c4e7b8a9d/768/432/Image/Webp/noFilter");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(20, 20, 40, 0.9);
            border: 2px solid #8b5cf6;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px #8b5cf6;
            text-align: center;
        }

        h1 {
            color: #c084fc;
            font-size: 35px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #a855f7;
        }

        .banner {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 2px solid #a855f7;
        }

        .code-box {
            background: #09090f;
            border: 2px solid #6d28d9;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
            overflow-x: auto;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: transparent;
            color: #c4b5fd;
            border: none;
            outline: none;
            resize: none;
            font-size: 16px;
            font-family: monospace;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #7c3aed, #c026d3);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px #a855f7;
        }

        #status {
            color: #86efac;
            margin-top: 15px;
            font-size: 15px;
        }

        .footer {
            margin-top: 20px;
            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚔ ANIME ADVENTURES ⚔</h1>

    <img class="banner"
         src="https://static.beebom.com/wp-content/uploads/2024/11/Roblox-Anime-Adventures-return-trailer-image-with-official-logo.jpg?w=1250&quality=75"
         alt="Anime Adventures">

    <div class="code-box">
        <textarea id="script" readonly>loadstring(game:HttpGet("https://raw.githubusercontent.com/Khangdz28/Mains/refs/heads/main/aa1-obfuscated.lua"))()</textarea>
    </div>

    <button onclick="copyCode()">📋 COPY SCRIPT</button>

    <p id="status"></p>

    <div class="footer">
        ANIME ADVENTURES • SCRIPT HUB
    </div>

</div>

<script>
    function copyCode() {
        const code = document.getElementById("script");

        navigator.clipboard.writeText(code.value)
            .then(() => {
                document.getElementById("status").innerText =
                    "✅ Script copied successfully!";
            })
            .catch(() => {
                code.select();
                document.execCommand("copy");
                document.getElementById("status").innerText =
                    "✅ Script copied!";
            });
    }
</script>

</body>
</html>
